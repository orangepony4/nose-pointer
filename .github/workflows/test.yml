name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile the application
        run: python -m compileall -q camera.py nose_pointer.py tracking.py windows_mouse.py
      - name: Test tracking without camera hardware
        run: python -m unittest discover -s tests -v
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.13.1'
          enable-cache: false
      - name: Check the Windows launcher from a folder with Cyrillic and spaces
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nose-pointer.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'Nose Pointer Проверка'
          git archive --format=zip --output $archive HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Set-Location -LiteralPath $destination
          & './Start Nose Pointer.cmd' --check --lang en
          exit $LASTEXITCODE
