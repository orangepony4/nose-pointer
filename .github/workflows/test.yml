name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Compile the application
        run: python -m compileall -q camera.py nose_pointer.py tracking.py windows_mouse.py
      - name: Test tracking without camera hardware
        run: python -m unittest discover -s tests -v
      - name: Check first launch without uv on PATH from a folder with Cyrillic and spaces
        shell: pwsh
        env:
          PYTHONUTF8: '1'
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'nose-pointer.zip'
          $destination = Join-Path $env:RUNNER_TEMP 'Nose Pointer Проверка'
          git archive --format=zip --output $archive HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Expand-Archive -LiteralPath $archive -DestinationPath $destination
          Set-Location -LiteralPath $destination
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          & './Start Nose Pointer.cmd' --check --lang en
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path -LiteralPath './.uv-bootstrap/uv.exe' -PathType Leaf)) {
            throw 'The launcher did not prepare its own verified copy of uv.'
          }
          $env:UV_OFFLINE = 'true'
          $env:HTTP_PROXY = $env:HTTPS_PROXY = $env:ALL_PROXY = 'http://127.0.0.1:9'
          $env:NO_PROXY = ''
          & './Start Nose Pointer.cmd' --check --lang ru
          exit $LASTEXITCODE
