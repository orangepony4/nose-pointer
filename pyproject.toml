[project]
name = "nose-pointer"
version = "0.10.0"
description = "A hands-free Windows pointer using a webcam and intentional winks"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mediapipe==1.2.2",
    "opencv-contrib-python==4.13.0.92",
]

[tool.uv]
package = false
environments = ["sys_platform == 'win32' and platform_machine == 'AMD64'"]
